<!doctype html>
<html lang="en">
  <head>
    <!-- ================= BASIC ================= -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ================= TITLE ================= -->
    <title>
      Liha Tech | Scalable IT Solutions, Cloud, AI & Software Development
    </title>

    <!-- ================= META DESCRIPTION ================= -->
    <meta
      name="description"
      content="Liha Tech is a technology consulting and engineering company delivering secure, scalable IT solutions including cloud, AI, data engineering, software development, and digital transformation for businesses and students."
    />

    <!-- ================= KEYWORDS (Optional but OK) ================= -->
    <meta
      name="keywords"
      content="Liha Tech, IT solutions, software development, cloud services, AI development, data engineering, DevOps, cybersecurity, technology consulting"
    />

    <!-- ================= AUTHOR ================= -->
    <meta name="author" content="Liha Tech" />

    <!-- ================= ROBOTS ================= -->
    <meta name="robots" content="index, follow" />

    <!-- ================= FAVICON ================= -->
    <link rel="icon" type="image/svg+xml" href="/liha.svg" />

    <!-- ================= OPEN GRAPH (Facebook / LinkedIn) ================= -->
    <meta property="og:title" content="Liha Tech | Scalable IT Solutions & Technology Consulting" />
    <meta
      property="og:description"
      content="We build secure, scalable, and future-ready digital systems. Partner with Liha Tech for cloud, AI, software engineering, and digital transformation."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.lihatech.com/" />
    <meta property="og:image" content="https://www.lihatech.com/og-image.png" />

    <!-- ================= TWITTER CARD ================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Liha Tech | Engineering Technology That Scales" />
    <meta
      name="twitter:description"
      content="Technology consulting and engineering company delivering reliable, scalable, and secure IT solutions."
    />
    <meta name="twitter:image" content="https://www.lihatech.com/og-image.png" />

    <!-- ================= THEME COLOR ================= -->
    <meta name="theme-color" content="#0f172a" />

    <!-- ================= PERFORMANCE ================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
