<!doctype html>
<html lang="en">

<head>
  <!-- ================= BASIC ================= -->
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ================= CANONICAL ================= -->
  <link rel="canonical" href="https://lihatech.com/" />

  <title>

  <link rel="icon" href="/favicon.ico" />

    content="Liha Tech is an IT services and technology consulting company delivering cloud solutions, AI & data engineering, enterprise software development, DevOps, and cybersecurity services." />

  <meta name="robots" content="index, follow, max-image-preview:large" />

  <!-- ================= FAVICON ================= -->

  <meta property="og:site_name" content="Liha Tech" />

    content="We design, build, and scale secure digital systems. Cloud, AI, enterprise software, and digital transformation services." />

    content="Enterprise IT services including cloud, AI, software engineering, and cybersecurity." />
  <meta name="twitter:image" content="https://lihatech.com/og-image.png" />

  <!-- ================= THEME ================= -->
